<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="980" height="400" fill="#ffffff"/>
  <text x="24" y="32" font-size="19" font-weight="700" fill="#111827">State History — 기록마다 VNode · patch · 역patch (양방향 연결 리스트, 한도 50)</text>

  <g font-size="12">
    <rect x="24" y="60" width="260" height="128" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="40" y="86" font-size="15" font-weight="700" fill="#111827">0번 기록 (처음 모습)</text>
    <text x="40" y="112" fill="#374151">snapshot: 페이지 로드 때 읽은 VNode</text>
    <text x="40" y="134" fill="#374151">patches: 없음</text>
    <text x="40" y="156" fill="#374151">inverse: 없음</text>
    <text x="40" y="178" font-size="11" fill="#6b7280">뒤로가기의 바닥</text>

    <rect x="360" y="60" width="260" height="128" rx="10" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="376" y="86" font-size="15" font-weight="700" fill="#111827">1번 기록</text>
    <text x="376" y="112" fill="#374151">snapshot: Patch 뒤 VNode</text>
    <text x="376" y="134" fill="#374151">patches: [SET_TEXT 안녕 → 반가워]</text>
    <text x="376" y="156" fill="#374151">inverse: [SET_TEXT 반가워 → 안녕]</text>

    <rect x="696" y="60" width="260" height="128" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2"/>
    <text x="712" y="86" font-size="15" font-weight="700" fill="#1d4ed8">2번 기록 ← 현재</text>
    <text x="712" y="112" fill="#374151">snapshot: Patch 뒤 VNode</text>
    <text x="712" y="134" fill="#374151">patches: [INSERT &lt;li&gt;넷]</text>
    <text x="712" y="156" fill="#374151">inverse: [REMOVE &lt;li&gt;넷]</text>
    <text x="712" y="178" font-size="11" fill="#6b7280">역patch는 저장할 때 이미 역순</text>
  </g>

  <path d="M284,108 H358" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M358,140 H286" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="300" y="101" font-size="11" fill="#6b7280">next</text>
  <text x="300" y="156" font-size="11" fill="#6b7280">prev</text>
  <path d="M620,108 H694" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M694,140 H622" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="636" y="101" font-size="11" fill="#6b7280">next</text>
  <text x="636" y="156" font-size="11" fill="#6b7280">prev</text>

  <g font-size="12.5">
    <rect x="24" y="218" width="300" height="160" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="40" y="244" font-size="15" font-weight="700" fill="#c2410c">[뒤로]</text>
    <text x="40" y="270" fill="#374151">실제 영역: 현재 기록의 inverse를</text>
    <text x="40" y="290" fill="#374151">  patch로 적용 (바뀐 곳만 되돌림)</text>
    <text x="40" y="316" fill="#374151">테스트 영역 · 편집창: 이전 기록의</text>
    <text x="40" y="336" fill="#374151">  snapshot으로 다시 그림</text>
    <text x="40" y="362" font-size="11.5" fill="#6b7280">처음 칸에서 누르면 무시</text>

    <rect x="340" y="218" width="300" height="160" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="356" y="244" font-size="15" font-weight="700" fill="#c2410c">[앞으로]</text>
    <text x="356" y="270" fill="#374151">실제 영역: 다음 기록의 patches를</text>
    <text x="356" y="290" fill="#374151">  다시 적용</text>
    <text x="356" y="316" fill="#374151">테스트 영역 · 편집창: 다음 기록의</text>
    <text x="356" y="336" fill="#374151">  snapshot으로 다시 그림</text>
    <text x="356" y="362" font-size="11.5" fill="#6b7280">끝 칸에서 누르면 무시</text>

    <rect x="656" y="218" width="300" height="160" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="672" y="244" font-size="15" font-weight="700" fill="#15803d">[Patch] (새 기록)</text>
    <text x="672" y="270" fill="#374151">바뀐 게 없으면 기록하지 않음</text>
    <text x="672" y="294" fill="#374151">뒤로 간 뒤 Patch하면</text>
    <text x="672" y="314" fill="#374151">  앞쪽 기록을 버리고 분기</text>
    <text x="672" y="338" fill="#374151">50개를 넘으면 가장 오래된 것부터 뺌</text>
    <text x="672" y="362" font-size="11.5" fill="#6b7280">이동 때 Patch 안 한 편집은 버림</text>
  </g>
</svg>
