<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 490" width="1050" height="490" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1050" height="490" fill="#ffffff"/>
  <text x="24" y="32" font-size="19" font-weight="700" fill="#111827">두 흐름이 같은 diff · patch를 쓴다</text>

  <!-- Phase 1 lane -->
  <text x="24" y="64" font-size="13" font-weight="700" fill="#1d4ed8">Phase 1 — 검증 페이지에서 [Patch]</text>
  <g font-size="12">
    <rect x="24" y="76" width="170" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="109" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">[Patch] 클릭</text>
    <text x="109" y="119" text-anchor="middle" fill="#374151">편집한 테스트 영역</text>
    <text x="109" y="134" text-anchor="middle" font-size="11" fill="#6b7280">fixtures</text>

    <rect x="224" y="76" width="250" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="349" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">domToVNode</text>
    <text x="349" y="119" text-anchor="middle" fill="#374151">테스트 영역 DOM → 새 VNode</text>
    <text x="349" y="134" text-anchor="middle" font-size="11" fill="#6b7280">react-dom-bindings</text>
  </g>
  <path d="M194,108 H222" stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M474,108 H705 V196" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <text x="560" y="100" font-size="11" fill="#1d4ed8">이전 = 지금 기록의 VNode</text>

  <!-- Core -->
  <rect x="590" y="168" width="230" height="186" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="604" y="188" font-size="12" font-weight="700" fill="#c2410c">공유 코어 (Phase 1에서 만든 것)</text>
  <g font-size="12">
    <rect x="610" y="198" width="190" height="64" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
    <text x="705" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">diff(이전, 새 VNode)</text>
    <text x="705" y="241" text-anchor="middle" fill="#374151">→ 고칠 일(patch) 목록</text>
    <text x="705" y="256" text-anchor="middle" font-size="11" fill="#6b7280">react-reconciler</text>

    <rect x="610" y="280" width="190" height="64" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
    <text x="705" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">patch(실제 DOM, 목록)</text>
    <text x="705" y="323" text-anchor="middle" fill="#374151">바뀐 곳만 순서대로 적용</text>
    <text x="705" y="338" text-anchor="middle" font-size="11" fill="#6b7280">react-dom-bindings</text>
  </g>
  <path d="M705,262 V278" stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <!-- Outputs -->
  <path d="M800,312 H838 V108 H858" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <path d="M838,312 V430 H858" stroke="#16a34a" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <g font-size="12">
    <rect x="860" y="76" width="170" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="945" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">History.push</text>
    <text x="945" y="119" text-anchor="middle" fill="#374151">VNode · patch · 역patch</text>
    <text x="945" y="134" text-anchor="middle" font-size="11" fill="#6b7280">react-dom</text>

    <rect x="860" y="398" width="170" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="945" y="422" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">effect 실행</text>
    <text x="945" y="441" text-anchor="middle" fill="#374151">DOM 반영 직후</text>
    <text x="945" y="456" text-anchor="middle" font-size="11" fill="#6b7280">react-reconciler</text>
  </g>

  <!-- Phase 2 lane -->
  <text x="24" y="388" font-size="13" font-weight="700" fill="#15803d">Phase 2 — 앱에서 클릭 · 입력</text>
  <g font-size="12">
    <rect x="24" y="398" width="160" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="104" y="422" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">setter(새 값)</text>
    <text x="104" y="441" text-anchor="middle" fill="#374151">hooks 칸 값을 바로 바꿈</text>
    <text x="104" y="456" text-anchor="middle" font-size="11" fill="#6b7280">react-reconciler</text>

    <rect x="204" y="398" width="170" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="289" y="422" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">scheduleRender</text>
    <text x="289" y="441" text-anchor="middle" fill="#374151">queueMicrotask로 1번</text>
    <text x="289" y="456" text-anchor="middle" font-size="11" fill="#6b7280">scheduler (Batching)</text>

    <rect x="394" y="398" width="180" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="484" y="422" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">update()</text>
    <text x="484" y="441" text-anchor="middle" fill="#374151">App() 재실행 → 새 VNode</text>
    <text x="484" y="456" text-anchor="middle" font-size="11" fill="#6b7280">FunctionComponent</text>
  </g>
  <path d="M184,430 H202" stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M374,430 H392" stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M484,398 V230 H608" stroke="#16a34a" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <text x="474" y="300" text-anchor="end" font-size="11" fill="#15803d">이전 = 지난 렌더 VNode</text>
</svg>
