    <text x="40" y="420" font-size="11" fill="#6b7280">00_master_dialogue.md [CheckPoint]</text>
    <rect x="40" y="430" width="96" height="20" rx="10" fill="#111827"/>
    <text x="88" y="444" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="700">내가 설명하기</text>

    <rect x="268" y="308" width="226" height="150" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="284" y="334" font-size="15" font-weight="700" fill="#111827">3 QA</text>
