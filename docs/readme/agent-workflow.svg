    <text x="528" y="168" fill="#374151">검수자: 기획 검수</text>
    <text x="528" y="186" fill="#374151">(가벼운 모드는 검수 생략)</text>
    <text x="528" y="212" font-size="11" fill="#6b7280">dev_todo.md · qa_todo.md</text>
    <rect x="528" y="222" width="132" height="20" rx="10" fill="#111827"/>
    <text x="594" y="236" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="700">내가 테스트 케이스 확인</text>

