  <path d="M250,383 H266" stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M494,383 H510" stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M738,383 H754" stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <!-- Footer -->
  <g font-size="12">
    <rect x="24" y="478" width="962" height="66" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="40" y="502" fill="#374151"><tspan font-weight="700" fill="#111827">기록:</tspan> 서브에이전트가 끝날 때마다 훅이 05_execution_timeline.log에 한 줄씩 자동 기록, 모든 산출물은 .agent_workflow/tasks/&lt;task&gt;/</text>
    <text x="40" y="526" fill="#374151"><tspan font-weight="700" fill="#111827">역할 분리:</tspan> 코드는 작업자만 고치고, 검수자는 읽기만, QA는 앱 · 테스트 코드를 고치지 않음, 위키는 기록에 없는 내용을 만들지 않음</text>
  </g>
