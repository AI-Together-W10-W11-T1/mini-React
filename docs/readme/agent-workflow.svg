    <text x="528" y="394" fill="#374151">마스터가 출처 확인</text>
    <text x="528" y="420" font-size="11" fill="#6b7280">wiki/*.md · README.md</text>
    <rect x="528" y="430" width="70" height="20" rx="10" fill="#111827"/>
    <text x="563" y="444" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="700">내가 승인</text>

    <rect x="756" y="308" width="230" height="150" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="772" y="334" font-size="15" font-weight="700" fill="#111827">마무리 · 병합</text>
    <text x="772" y="358" fill="#374151">변경 요약 · 검증 결과 · 남은 일</text>
    <text x="772" y="376" fill="#374151">feature/&lt;작업명&gt; → main</text>
    <text x="772" y="394" fill="#374151">push · 원격은 매번 승인</text>
    <text x="772" y="420" font-size="11" fill="#6b7280">07_pr_body.md</text>
    <rect x="772" y="430" width="70" height="20" rx="10" fill="#111827"/>
    <text x="807" y="444" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="700">내가 승인</text>
