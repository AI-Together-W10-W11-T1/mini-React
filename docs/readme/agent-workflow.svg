    <rect x="312" y="48" width="160" height="26" rx="13" fill="#dbeafe" stroke="#2563eb"/>
    <text x="392" y="66" text-anchor="middle" fill="#1d4ed8" font-weight="700">mr-worker · Sonnet</text>
    <rect x="482" y="48" width="200" height="26" rx="13" fill="#ffedd5" stroke="#ea580c"/>
    <text x="582" y="66" text-anchor="middle" fill="#c2410c" font-weight="700">mr-reviewer · Opus (읽기만)</text>
    <rect x="692" y="48" width="140" height="26" rx="13" fill="#dcfce7" stroke="#16a34a"/>
