  </defs>
  <rect width="1010" height="560" fill="#ffffff"/>
  <text x="24" y="32" font-size="19" font-weight="700" fill="#111827">AI 에이전트 워크플로 — task 하나가 지나가는 길</text>

  <!-- Legend: roles -->
  <g font-size="12">
    <rect x="24" y="48" width="118" height="26" rx="13" fill="#111827"/>
