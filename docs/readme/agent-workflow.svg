    <text x="284" y="376" fill="#374151">desktop · mobile로 실행 + 캡처</text>
    <text x="284" y="394" font-weight="700" fill="#dc2626">실패 → 구현 · 테스트 · 명세 3갈래</text>
    <text x="284" y="420" font-size="11" fill="#6b7280">qa_todo_result.md · screenshot_*.png</text>
    <rect x="284" y="430" width="120" height="20" rx="10" fill="#111827"/>
    <text x="344" y="444" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="700">내가 캡처 직접 확인</text>

    <rect x="512" y="308" width="226" height="150" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
