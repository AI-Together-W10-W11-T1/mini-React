    <rect x="24" y="100" width="226" height="150" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="40" y="126" font-size="15" font-weight="700" fill="#111827">0 명세</text>
    <text x="40" y="150" fill="#374151">grill-me 인터뷰로 요구사항 ·</text>
    <text x="40" y="168" fill="#374151">범위 · 알고리즘 결정</text>
    <text x="40" y="186" fill="#374151">(내가 말로 먼저 답한 뒤 후보 비교)</text>
    <text x="40" y="212" font-size="11" fill="#6b7280">01_request_spec.md</text>
    <rect x="40" y="222" width="96" height="20" rx="10" fill="#111827"/>
    <text x="88" y="236" text-anchor="middle" font-size="11" fill="#ffffff" font-weight="700">내가 명세 승인</text>

    <rect x="268" y="100" width="226" height="150" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
