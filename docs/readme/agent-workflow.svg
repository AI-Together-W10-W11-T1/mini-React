    <text x="772" y="212" font-size="11" fill="#6b7280">NN_diff.patch · code_review_log.md</text>
    <text x="772" y="238" font-size="11.5" font-weight="700" fill="#dc2626">REJECT → 재작업 (최대 3회차)</text>
  </g>
  <path d="M250,175 H266" stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M494,175 H510" stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M738,175 H754" stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
