<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1000" height="380" fill="#ffffff"/>
  <text x="24" y="32" font-size="19" font-weight="700" fill="#111827">검증 방법 — 바깥 루프(인수 테스트) 안에 안쪽 루프(단위 테스트)</text>

  <!-- Outer loop -->
  <rect x="24" y="52" width="952" height="310" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="44" y="78" font-size="14" font-weight="700" fill="#1d4ed8">바깥 루프: ATDD — Playwright Test (e2e/*.spec.ts), desktop 1280×800 · mobile 375×812</text>

  <g font-size="12.5">
    <rect x="44" y="100" width="210" height="110" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="60" y="126" font-size="14" font-weight="700" fill="#111827">① 인수 테스트 먼저</text>
    <text x="60" y="150" fill="#374151">PRD 수용 기준으로</text>
    <text x="60" y="170" fill="#374151">화면 시나리오 스펙 작성</text>
    <text x="60" y="194" font-weight="700" fill="#dc2626">실행 → 실패 확인</text>

    <rect x="726" y="100" width="230" height="110" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="742" y="126" font-size="14" font-weight="700" fill="#111827">③ 인수 테스트 통과</text>
    <text x="742" y="150" fill="#374151">같은 스펙을 desktop · mobile</text>
    <text x="742" y="170" fill="#374151">두 화면에서 다시 실행</text>
    <text x="742" y="194" font-weight="700" fill="#16a34a">통과해야 완료</text>
  </g>

  <!-- Inner loop -->
  <rect x="284" y="96" width="412" height="186" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="300" y="120" font-size="13.5" font-weight="700" fill="#15803d">② 안쪽 루프: TDD — Vitest + jsdom (packages/*/__tests__)</text>
  <g font-size="12.5">
    <rect x="304" y="140" width="112" height="58" rx="29" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
    <text x="360" y="165" text-anchor="middle" font-weight="700" fill="#b91c1c">RED</text>
    <text x="360" y="184" text-anchor="middle" font-size="11.5" fill="#374151">실패 테스트</text>

    <rect x="434" y="140" width="112" height="58" rx="29" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="490" y="165" text-anchor="middle" font-weight="700" fill="#15803d">GREEN</text>
    <text x="490" y="184" text-anchor="middle" font-size="11.5" fill="#374151">최소 구현</text>

    <rect x="564" y="140" width="112" height="58" rx="29" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.4"/>
    <text x="620" y="165" text-anchor="middle" font-weight="700" fill="#4338ca">REFACTOR</text>
    <text x="620" y="184" text-anchor="middle" font-size="11.5" fill="#374151">정리</text>
  </g>
  <path d="M416,169 H432" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M546,169 H562" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M620,198 V230 H360 V200" stroke="#374151" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="404" y="250" font-size="11.5" fill="#374151">diff · patch · History · Hook 함수 하나씩 반복</text>
  <text x="404" y="268" font-size="11.5" fill="#6b7280">파일을 고치면 관련 단위 테스트가 훅으로 자동 실행</text>

  <path d="M254,155 H282" stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <path d="M696,155 H724" stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#a)"/>

  <!-- After -->
  <g font-size="12.5">
    <rect x="44" y="298" width="912" height="50" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.3"/>
    <text x="60" y="320" font-weight="700" fill="#111827">그다음:</text>
    <text x="118" y="320" fill="#374151">검수자가 diff · 완료 근거 검수 → QA가 qa_todo.md 시나리오를 desktop · mobile로 실행해 캡처를 남김</text>
    <text x="118" y="339" fill="#374151">→ 내가 캡처를 직접 열어 「사람 확인」 체크 (README의 화면은 모두 이 캡처)</text>
  </g>
</svg>
